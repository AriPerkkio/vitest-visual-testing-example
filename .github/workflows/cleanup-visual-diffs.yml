name: Clean up visual diffs

# Deletes the vrt/pr-<number> branch that holds the images of the visual
# differences comment (see the visual-diff-comment job in ci.yml) once the PR
# is merged or closed. Deleting the branch also drops its history.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-branch:
    # Fork PRs never get a branch: their token can't push.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete vrt/pr-${{ github.event.pull_request.number }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api -X DELETE "repos/$REPO/git/refs/heads/vrt/pr-$PR" \
            && echo "Deleted vrt/pr-$PR." \
            || echo "No vrt/pr-$PR branch to delete."
