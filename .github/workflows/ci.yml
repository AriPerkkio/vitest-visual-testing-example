name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel runs on main: each main commit's upload is the Sentry baseline
  # for PRs branched from it. A skipped commit would leave those PRs without one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Run in the official Playwright image. Its fonts and browser builds are pinned,
    # so screenshots render the same on every run.
    # Keep the tag in sync with the `playwright` version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    env:
      # The container runs as root, but GitHub sets $HOME to /github/home, which
      # belongs to another user. Firefox refuses to launch in that case.
      HOME: /root
      # Repository secrets. Fork PRs don't get them, so they skip the upload.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
    steps:
      - name: Ensure git is available
        run: command -v git || (apt-get update && apt-get install -y --no-install-recommends git)

      - uses: actions/checkout@v7
        with:
          # Sentry matches uploads by commit. Check out the PR head, not GitHub's
          # merge commit, and fetch the history so sentry-cli can find the merge-base
          # with main, whose upload is the baseline.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      # The container runs as root, while the workspace belongs to the runner user.
      # Without this, git refuses to read the repository and sentry-cli can't
      # detect the commit.
      - name: Mark the workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - run: pnpm typecheck

      # Writes every screenshot to snapshots/. Visual changes don't fail this step:
      # Sentry compares the snapshots and reports them as the "Snapshot Testing" check.
      - name: Tests
        run: pnpm test --run

      # Only upload a complete set. If tests failed, missing screenshots would
      # show up in Sentry as removed snapshots.
      - name: Upload snapshots to Sentry
        if: ${{ success() && env.SENTRY_AUTH_TOKEN != '' }}
        run: pnpm exec sentry-cli snapshots upload snapshots --app-id skycast-web

      # Upload the HTML report even when tests fail. Pull requests get a regular
      # artifact, other runs deploy it to GitHub Pages.
      - name: Upload HTML report (pull request)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: vitest-report
          path: .vitest
          include-hidden-files: true

      - name: Upload HTML report (GitHub Pages)
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: .vitest

  deploy-report:
    needs: test
    # Run even when tests failed, as long as the report was produced.
    # GitHub Pages environments only accept deployments from the default branch
    # by default, so PR runs keep the report as a downloadable artifact instead.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.test.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
