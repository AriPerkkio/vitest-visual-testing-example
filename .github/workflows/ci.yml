name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Run in the official Playwright image. Its fonts and browser build are pinned,
    # so screenshots render the same on every run. You can also use it locally
    # to generate matching `-linux` references with Docker.
    # Keep the tag in sync with the `playwright` version in package.json, and with
    # update-screenshots.yml, which generates the references this job compares against.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - name: Ensure git is available
        run: command -v git || (apt-get update && apt-get install -y --no-install-recommends git)

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - run: pnpm typecheck

      - name: Visual regression tests
        run: pnpm test --run

      # Upload the HTML report even when tests fail: that's when you need the diffs.
      # Pull requests get a regular artifact, which the visual-diff-comment job reads.
      - name: Upload HTML report (pull request)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: vitest-report
          path: .vitest
          include-hidden-files: true

      - name: Upload HTML report (GitHub Pages)
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: .vitest

  # Posts the failed screenshots (reference / actual / diff) as a PR comment.
  # The images are pushed to a `vrt/pr-<number>` branch and shown through
  # raw.githubusercontent.com. See scripts/vrt-comment.mjs.
  # Fork PRs get a read-only token, so they only get the vitest-report artifact.
  visual-diff-comment:
    needs: test
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the images to the vrt/pr-<number> branch
      pull-requests: write # create and update the comment
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      # Missing when the test job failed before running the tests; the script
      # then leaves the comment unchanged.
      - name: Download HTML report
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: vitest-report
          path: report

      - name: Post visual differences
        uses: actions/github-script@v9
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          script: |
            const { default: run } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/vrt-comment.mjs`);
            await run({ github, context, core, reportDir: "report", token: process.env.GITHUB_TOKEN });

  deploy-report:
    needs: test
    # Run even when tests failed, as long as the report was produced.
    # GitHub Pages environments only accept deployments from the default branch
    # by default, so PR runs keep the report as a downloadable artifact instead.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.test.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
